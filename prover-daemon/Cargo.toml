[package]
name = "junoclaw-prover"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Prover daemon for JunoClaw — generates ZK safety proofs from robot sensor data and submits on-chain"
keywords = ["zero-knowledge", "robotics", "safety", "groth16", "juno"]
categories = ["cryptography", "science::robotics"]

[[bin]]
name = "junoclaw-prover"
path = "src/main.rs"

[dependencies]
# ZK circuits
sensor-safety-circuit = { path = "../circuits/sensor-safety" }
intent-safety-circuit = { path = "../circuits/intent-safety" }
consensus-safety-circuit = { path = "../circuits/consensus-safety" }
proof-aggregation-circuit = { path = "../circuits/proof-aggregation" }

# Arkworks
ark-groth16 = { version = "0.4", default-features = false }
ark-serialize = { version = "0.4", default-features = false }
ark-snark = { version = "0.4", default-features = false }
ark-bn254 = { version = "0.4", default-features = false, features = ["curve"] }
ark-ff = { version = "0.4", default-features = false }
ark-std = { version = "0.4", default-features = false }

# HTTP + serialization
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
sha2 = "0.10"
anyhow = "1"
toml = "0.8"
chrono = "0.4"
