<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not found — JunoClaw</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#07040f" />
  <link rel="icon" type="image/png" href="/assets/logo-96.png" />
  <link rel="stylesheet" href="/assets/fonts/fonts.css" />
  <style>
    :root {
      --bg: #05030c; --border: rgba(139, 92, 246, 0.16); --border-strong: rgba(139, 92, 246, 0.38);
      --violet-bright: #b49cff; --gold: #d4af37; --gold-bright: #ecd08a;
      --text: #f3f1fa; --muted: #a8a2c6; --dim: #6d6790;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --sans: 'Inter', 'Segoe UI', system-ui, sans-serif;
      --display: 'Space Grotesk', 'Inter', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 2rem;
      background: radial-gradient(40% 35% at 50% 0%, rgba(139, 92, 246, 0.22), transparent 70%), var(--bg);
      color: var(--text); font-family: var(--sans); line-height: 1.65; -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 34rem; width: 100%; text-align: center; padding: 3rem 2.4rem;
      background: rgba(20, 13, 40, 0.55); border: 1px solid var(--border-strong); border-radius: 16px;
    }
    .brand { display: inline-flex; align-items: center; gap: 0.6rem; text-decoration: none; color: var(--text);
      font-family: var(--display); font-weight: 700; letter-spacing: 0.12em; margin-bottom: 1.8rem; }
    .brand img { width: 34px; height: 34px; }
    .brand em { font-style: normal; color: var(--gold); }
    .code { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.18em; color: var(--gold); text-transform: uppercase; }
    h1 { font-family: var(--display); font-size: 2rem; margin: 0.4rem 0 0.8rem; }
    p { color: var(--muted); margin-bottom: 1.6rem; }
    code { font-family: var(--mono); font-size: 0.86em; color: var(--violet-bright); }
    .links { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; }
    .links a { text-decoration: none; color: var(--text); font-size: 0.92rem; padding: 0.55rem 1.1rem;
      border: 1px solid var(--border-strong); border-radius: 999px; }
    .links a.gold { border-color: var(--gold); color: var(--gold-bright); }
    .links a:hover { border-color: var(--gold-bright); }
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="/"><img src="/assets/logo-96.png" alt="" /><span>JUNO<em>CLAW</em></span></a>
    <div class="code">404 · no such block</div>
    <h1>This page isn’t on the chain.</h1>
    <p>The link may be old or mistyped. Everything that does exist is one hop away — and every block that exists is on the <code>explorer</code>.</p>
    <div class="links">
      <a class="gold" href="/">Home</a>
      <a href="/docs/">Docs</a>
      <a href="/docs/lightpaper/">Lightpaper</a>
      <a href="https://explorer.junoclaw.xyz" rel="noopener">Explorer</a>
    </div>
  </main>
</body>
</html>
