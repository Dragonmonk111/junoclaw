---
# JunoClaw Buzz Relay Stack — Akash SDL
# Deploy via: https://console.akash.network
#
# WHAT THIS DOES:
#   Runs the DAO-owned Buzz relay (Nostr protocol) on Akash with
#   Postgres 17, Redis 7, and MinIO as sidecar services.
#   Caddy is omitted — Cloudflare free tier handles TLS termination.
#
# ARCHITECTURE:
#   buzz-relay  — Rust binary, speaks Nostr WebSocket protocol (port 3000)
#   frontend    — nginx serving BuzzPanel SPA + proxying WebSocket to relay (port 80)
#   postgres    — Event store, channel metadata, user profiles (port 5432)
#   redis       — Pub/sub for real-time event broadcast (port 6379)
#   minio       — S3-compatible object store for attachments (port 9000)
#
# WHAT IT CONNECTS TO:
#   - Inbound: https://buzz.junoclaw.xyz (via Cloudflare → Akash port 80 → nginx)
#   - Outbound: None (agents connect to it, not vice versa)
#   - Internal: nginx → relay:3000 (WebSocket proxy), relay ↔ postgres, relay ↔ redis, relay ↔ minio
#
# Wallet: akash1dlm6y5cnvxayyv6hxd863lef82vu9jneewt5g3
# Balance: ~63.77 AKT (covers ~2 months)
# Est. cost: ~1 AKT/day (~$9-11/month at AKT ≈ $0.30)
# Escrow deposit: 5 AKT (refundable on close)
#
# DNS: buzz.junoclaw.xyz → A record → Akash provider IP (Cloudflare)
# TLS: Cloudflare edge terminates TLS, forwards HTTP to Akash port 80 (nginx)
# nginx serves frontend static files + proxies /ws and /_liveness to relay:3000
#
# BEFORE DEPLOYING:
#   1. Generate keys: cargo run -p junoclaw-nostr-bridge --example generate_keypair
#   2. Register domain: junoclaw.xyz at Namecheap or Cloudflare (~$1-2/year)
#   3. Create DNS: buzz.junoclaw.xyz A record → Akash provider IP
#   4. Replace every CHANGE_ME below with real values
#
# PERSISTENT STORAGE NOTE:
#   Akash leases are ephemeral. If the provider drops the lease, Postgres
#   data is lost. Mitigation: add a pg_dump cron to /data/backups and
#   periodically pull via the minio S3 API. For Phase 1, accept the risk —
#   Buzz is a coordination layer, not a permanent store. Moultbook is
#   the permanent layer.

version: "2.0"

services:
  frontend:
    image: ghcr.io/dragonmonk111/junoclaw-frontend:v2
    expose:
      - port: 80
        as: 80
        to:
          - global: true
        proto: tcp
        accept:
          - buzz.junoclaw.xyz
    depends_on:
      - buzz-relay

  buzz-relay:
    # Build from upstream: github.com/block/buzz
    # docker build -t junoclaw/buzz-relay:latest .
    # docker push ghcr.io/<your-gh>/buzz-relay:latest
    image: ghcr.io/dragonmonk111/buzz-relay:latest
    command:
      - /bin/bash
      - -c
    args:
      - "until bash -c 'exec 3<>/dev/tcp/postgres/5432' 2>/dev/null; do echo 'waiting for postgres'; sleep 2; done && until bash -c 'exec 3<>/dev/tcp/redis/6379' 2>/dev/null; do echo 'waiting for redis'; sleep 2; done && until bash -c 'exec 3<>/dev/tcp/minio/9000' 2>/dev/null; do echo 'waiting for minio'; sleep 2; done && echo 'all deps ready' && exec /usr/local/bin/buzz-relay"
    env:
      - RELAY_OWNER_PUBKEY=36944fabbccca892a33778e133eac3e9def36ec520513e8e637cf5113706edfe
      - BUZZ_RELAY_PRIVATE_KEY=2db9dc85c289cf13d42abc9e5d12848c956df73047fab93f5827a3d04119735b
      - RELAY_URL=http://localhost:3000
      - BUZZ_REQUIRE_RELAY_MEMBERSHIP=false
      - BUZZ_AUTO_MIGRATE=true
      - DATABASE_URL=postgres://buzz:02Mn9Xs1JcSLy6oFdq4mB3Zl@postgres:5432/buzz
      - REDIS_URL=redis://redis:6379
      - BUZZ_S3_ENDPOINT=http://minio:9000
      - BUZZ_S3_ACCESS_KEY=3jqbcumzo8px
      - BUZZ_S3_SECRET_KEY=U5CnRlrigf3aLImXWSpeK0jd1txTkME8
      - BUZZ_S3_BUCKET=buzz-media
      - BUZZ_S3_ADDRESSING_STYLE=path
      - RUST_LOG=buzz_relay=info,buzz_db=info,buzz_auth=info,buzz_pubsub=info,tower_http=info
    expose:
      - port: 3000
        to:
          - service: frontend
        proto: tcp
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: postgres:17-alpine
    env:
      - POSTGRES_USER=buzz
      - POSTGRES_PASSWORD=02Mn9Xs1JcSLy6oFdq4mB3Zl
      - POSTGRES_DB=buzz
    expose:
      - port: 5432
        to:
          - service: buzz-relay
        proto: tcp

  redis:
    image: redis:7-alpine
    expose:
      - port: 6379
        to:
          - service: buzz-relay
        proto: tcp

  minio:
    image: minio/minio:latest
    args:
      - server
      - /data
      - --console-address
      - ":9001"
    env:
      - MINIO_ROOT_USER=3jqbcumzo8px
      - MINIO_ROOT_PASSWORD=U5CnRlrigf3aLImXWSpeK0jd1txTkME8
    expose:
      - port: 9000
        to:
          - service: buzz-relay
          - service: minio-init
        proto: tcp

  minio-init:
    image: minio/mc:latest
    command:
      - /bin/sh
      - -c
    args:
      - "until /usr/bin/mc alias set myminio http://minio:9000 3jqbcumzo8px U5CnRlrigf3aLImXWSpeK0jd1txTkME8 2>/dev/null; do echo 'waiting for minio'; sleep 2; done && /usr/bin/mc mb myminio/buzz-media --ignore-existing && /usr/bin/mc anonymous set download myminio/buzz-media && echo 'bucket created' && sleep 3600"
    depends_on:
      - minio


profiles:
  compute:
    frontend:
      resources:
        cpu:
          units: 0.1
        memory:
          size: 128Mi
        storage:
          - size: 256Mi
    buzz-relay:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          - size: 2Gi
    postgres:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          - size: 5Gi
    redis:
      resources:
        cpu:
          units: 0.25
        memory:
          size: 128Mi
        storage:
          - size: 256Mi
    minio:
      resources:
        cpu:
          units: 0.25
        memory:
          size: 256Mi
        storage:
          - size: 256Mi
    minio-init:
      resources:
        cpu:
          units: 0.1
        memory:
          size: 64Mi
        storage:
          - size: 256Mi
  placement:
    akash:
      pricing:
        frontend:
          denom: uact
          amount: 30
        buzz-relay:
          denom: uact
          amount: 30
        postgres:
          denom: uact
          amount: 40
        redis:
          denom: uact
          amount: 15
        minio:
          denom: uact
          amount: 15
        minio-init:
          denom: uact
          amount: 5

deployment:
  frontend:
    akash:
      profile: frontend
      count: 1
  buzz-relay:
    akash:
      profile: buzz-relay
      count: 1
  postgres:
    akash:
      profile: postgres
      count: 1
  redis:
    akash:
      profile: redis
      count: 1
  minio:
    akash:
      profile: minio
      count: 1
  minio-init:
    akash:
      profile: minio-init
      count: 1
