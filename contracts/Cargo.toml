[workspace]
members = [
    "junoclaw-common",
    "agent-registry",
    "task-ledger",
    "escrow",
    "agent-company",
    "junoswap-factory",
    "junoswap-pair",
    "faucet",
    "builder-grant",
    "zk-verifier",
    "moultbook-v0",
    "knowledge-moults",
    "ibc-task-host",
    "jclaw-credential",
    "skill-registry",
    "coordination-settler",
    "truth-market",
    "machine-rwa",
    "marketplace",
    "emergency-compute-escrow",
    "safety-envelope",
    "circuit-breaker",
    "merkle-verifier",
    "airdrop-claim",
    "junoclaw-dao",
    "integration-tests",
    "tee-attestation-verifier",
    "jolt-cw-verifier",
    "cw-ics20-transfer",
]
resolver = "2"

[workspace.dependencies]
cosmwasm-std = { version = "2.2", features = ["cosmwasm_2_2"] }
serde_json = "1.0"
cosmwasm-schema = "2.2"
cw-storage-plus = "2.0"
cw2 = "2.0"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "2.0"
cw-multi-test = "2.3"
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
junoclaw-common = { path = "junoclaw-common" }
junoclaw-mayo-verify = { path = "../crates/junoclaw-mayo-verify", default-features = false }

# Arkworks ZK ecosystem (pinned for zk-verifier)
ark-bn254 = "0.5"
ark-groth16 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-serialize = { version = "0.5", features = ["derive"] }
ark-std = "0.5"
ark-relations = "0.5"
ark-snark = "0.5"
ark-r1cs-std = "0.5"

# Match the jolt workspace's arkworks overrides: jolt-verifier (used by
# jolt-cw-verifier's full-verification feature) is built against the a16z
# arkworks-algebra fork. [patch] tables do not propagate to downstream
# consumers, so the same entries must live in this workspace root — otherwise
# crates.io ark-ff 0.5.0 and the git fork coexist and trait bounds fail.
# The fork reports version 0.5.0, so the ark-* = "0.5" deps above still resolve.
[patch.crates-io]
ark-bn254 = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-ff = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-ec = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-serialize = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }

# JunoClaw's sovereign chain runs a patched cosmwasm-vm/std (v2.3.2) that
# exposes the BN254 host functions (`bn254_add`, `bn254_scalar_mul`,
# `bn254_pairing_equality`) on the `Api` trait behind the `cosmwasm_2_3`
# feature. Point cosmwasm-std at the junoclaw-chain submodule so contracts
# build against the same std the chain runs. The patched std is a superset of
# crates.io 2.3.2 — contracts that don't enable `cosmwasm_2_3` build
# identically. Its `workspace = true` internal deps resolve against
# lib/cosmwasm's own workspace (pinned =2.3.2 → crates.io for unchanged
# crates); only `cosmwasm-crypto-bn254` is new and resolves via its
# `path = "../crypto-bn254"`.
cosmwasm-std = { path = "../../junoclaw-chain/lib/cosmwasm/packages/std" }

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

