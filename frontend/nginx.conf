server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket proxy to relay — Nostr protocol
    # Relay expects WS at / (root), not /ws — trailing slash strips /ws prefix
    # Host must be the real public host so it matches RELAY_URL's community
    # binding and NIP-42 AUTH's signed `relay` tag (see tenant.rs).
    location /ws {
        proxy_pass http://buzz-relay:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # NIP-11 relay info + Nostr HTTP API
    location /_liveness {
        proxy_pass http://buzz-relay:3000;
        proxy_set_header Host $host;
    }

    # Buzz Nostr HTTP bridge — NIP-98 authed REST surface used by CLI/agent
    # tools (Hermes adapter etc). Real upstream surface per block/buzz:
    # POST /events, POST /query, POST /count, /hooks/{id}, Blossom media,
    # git smart HTTP, NIP-11/NIP-05 metadata. There is no bare /channels or
    # /users REST route — channel/user listing goes through POST /query
    # with a Nostr filter, so proxy those paths through to the relay.
    #
    # IMPORTANT: these paths are NIP-98/NIP-42 authed and the relay binds
    # tenant + verifies signed URLs off the request Host header (see
    # buzz-relay/src/api/bridge.rs bind_community / nip98_expected_url).
    # Do NOT rewrite Host to localhost:3000 here — must forward the
    # original Host (buzz.junoclaw.xyz) so it matches what the client
    # signed, or NIP-98 verification will fail with a tenant mismatch.
    location ~ ^/(events|query|count)$ {
        proxy_pass http://buzz-relay:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /hooks/ {
        proxy_pass http://buzz-relay:3000;
        proxy_set_header Host $host;
    }

    location /git/ {
        proxy_pass http://buzz-relay:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /.well-known/ {
        proxy_pass http://buzz-relay:3000;
        proxy_set_header Host $host;
    }

    # Static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
