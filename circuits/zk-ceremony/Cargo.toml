[package]
name = "zk-ceremony"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Sequential Groth16 phase-2 MPC for the jlens-readout circuit — delta-contribution transcript across the validator fleet"

[dependencies]
jlens-readout-circuit = { path = "../jlens-readout" }
sensor-safety-circuit = { path = "../sensor-safety" }
ark-bn254 = "0.5"
ark-groth16 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-serialize = "0.5"
ark-std = "0.5"
ark-relations = "0.5"
ark-snark = "0.5"
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"

[[bin]]
name = "zk-ceremony"
path = "src/main.rs"
